services:
  - type: web
    name: f1-telemetry-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn race_strategy.service:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 25
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: CORS_ORIGINS
        sync: false
      - key: READ_LIMIT_PER_MINUTE
        value: "120"
